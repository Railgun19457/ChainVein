  - copper_ore
  - deepslate_copper_ore
  - iron_ore
  - deepslate_iron_ore
  - gold_ore
  - deepslate_gold_ore
  - redstone_ore
  - deepslate_redstone_ore
  - lapis_ore
  - deepslate_lapis_ore
  - diamond_ore
  - deepslate_diamond_ore
  - emerald_ore
  - deepslate_emerald_ore
  - nether_gold_ore
  - nether_quartz_ore
  - oak_log
